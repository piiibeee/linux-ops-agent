apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  namespace: ops-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ops-agent
  labels:
    app.kubernetes.io/name: ops-agent
    app.kubernetes.io/part-of: linux-ops-agent
  annotations:
    # 改成你自己的镜像地址；本地 k3s 用 ops-agent-api:1.0 即可
    ops-agent/build: "docker build -t ops-agent-api:1.0 ."
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-agent
    spec:
      containers:
        - name: api
          image: ops-agent-api:1.0
          imagePullPolicy: IfNotPresent   # 本地镜像，不要每次都去拉
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ops-agent-config
            - secretRef:
                name: ops-agent-secret
          # 就绪未通过则不进 Service 后端，避免流量打到还没建好知识库的实例
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # 存活失败则重启容器；start-period 留足 uvicorn 启动时间
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: chroma
              mountPath: /app/data/chroma
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: chroma
          persistentVolumeClaim:
            claimName: chroma-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ops-agent
  labels:
    app.kubernetes.io/name: ops-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ops-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
