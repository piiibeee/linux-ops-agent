# /etc/nginx/snippets/ops-agent-proxy.conf
#
# 反代到本机 uvicorn 的公共指令。
# 抽出来是因为有两处 location 都要用它：
#   location /api/       —— 对话与写操作（严格限流）
#   location /api/audit  —— 管理端只读查询（放宽限流，见下）
# 两处若各写一份，改超时的时候必然漏掉一处。

proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 关键：/api/chat 是 SSE 流式返回。
# 不关 buffering 的话 Nginx 会把整段响应攒齐再发，
# 前端会「转很久然后一次性蹦出全部内容」，看起来像卡死。
proxy_buffering off;
proxy_cache off;
proxy_set_header Connection '';
chunked_transfer_encoding off;

# Agent 单轮可能跑 6 轮工具调用，给足时间
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
