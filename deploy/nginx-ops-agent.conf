# /etc/nginx/sites-available/ops-agent
# 部署后软链到 sites-enabled/，删掉默认站点

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 前端构建产物（vite build 的输出）
    root /opt/ops-agent/web/dist;
    index index.html;

    # 上传的消息体不大，限制一下防止被塞大包
    client_max_body_size 1m;

    access_log /var/log/nginx/ops-agent.access.log;
    error_log  /var/log/nginx/ops-agent.error.log;

    # ── 前端：history 路由回退 ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── API 反代 ───────────────────────────────────
    location /api/ {
        limit_req zone=opsagent burst=10 nodelay;
        limit_conn opsconn 5;
        include /etc/nginx/snippets/ops-agent-proxy.conf;
    }

    # ── 健康检查：浏览器每次刷新/开标签都会打，放宽 ──
    # 走 20r/m 的话，刷新十几次就 429，管理台顶栏会显示「后端未连接」，
    # 看起来像服务挂了，其实只是被自己的限流挡了。
    location = /api/health {
        limit_req zone=opsadmin burst=30 nodelay;
        include /etc/nginx/snippets/ops-agent-proxy.conf;
    }

    # ── 管理端只读查询：单独放宽限流 ────────────────
    # 审计页每筛一次要发 /api/audit + /api/audit/stats 两个请求，
    # 走进上面的 20r/m，翻十几页就会被 429 —— 用户会以为后台坏了。
    # 这里只放开这一条只读路径，对话与写操作仍然走严格档。
    # nginx 前缀匹配取最长，所以这条会覆盖 /api/ 那条。
    location /api/audit {
        limit_req zone=opsadmin burst=40 nodelay;
        limit_conn opsconn 10;
        include /etc/nginx/snippets/ops-agent-proxy.conf;
    }

    # ── 健康检查不对外暴露细节，但保留可用 ─────────
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    # 屏蔽常见扫描路径
    location ~ /\.(git|env|venv) { deny all; return 404; }
}
