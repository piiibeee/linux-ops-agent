# /etc/nginx/sites-available/ops-agent
# 部署后软链到 sites-enabled/，删掉默认站点

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 前端构建产物（vite build 的输出）
    root /opt/ops-agent/web/dist;
    index index.html;

    # 上传的消息体不大，限制一下防止被塞大包
    client_max_body_size 1m;

    access_log /var/log/nginx/ops-agent.access.log;
    error_log  /var/log/nginx/ops-agent.error.log;

    # ── 前端：history 路由回退 ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── API 反代 ───────────────────────────────────
    location /api/ {
        limit_req zone=opsagent burst=10 nodelay;
        limit_conn opsconn 5;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：/api/chat 是 SSE 流式返回。
        # 不关 buffering 的话 Nginx 会把整段响应攒齐再发，
        # 前端会「转很久然后一次性蹦出全部内容」，看起来像卡死。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Agent 单轮可能跑 6 轮工具调用，给足时间
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── 健康检查不对外暴露细节，但保留可用 ─────────
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    # 屏蔽常见扫描路径
    location ~ /\.(git|env|venv) { deny all; return 404; }
}
