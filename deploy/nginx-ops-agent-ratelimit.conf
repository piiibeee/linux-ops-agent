# 放在 /etc/nginx/conf.d/ 下，属于 http{} 块内
# 目的：防止有人刷 /api/chat 烧掉大模型额度

# 对话与写操作：一次对话一个请求，20r/m 足够，主要防刷额度
limit_req_zone $binary_remote_addr zone=opsagent:10m rate=20r/m;
limit_req_status 429;

# 管理端只读查询：审计页每筛一次发 audit + stats 两个请求，
# 沿用 20r/m 的话操作十几次就被 429，看起来像「后台坏了」。
# 单独给一个宽松档；只挂在 /api/audit 这一条只读路径上，不影响对话限流。
limit_req_zone $binary_remote_addr zone=opsadmin:10m rate=180r/m;

# 单个 IP 同时建立的连接数，挡住并发刷
limit_conn_zone $binary_remote_addr zone=opsconn:10m;
